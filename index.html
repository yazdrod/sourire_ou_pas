<div id="scene" style="min-height: 560px; background: linear-gradient(160deg, #FBEAF0 0%, #EEEDFE 55%, #E1F5EE 100%); border-radius: 20px; padding: 2rem 1.25rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; box-sizing: border-box;">
  <h2 class="sr-only">Petit message doux animé pour une journée de repos</h2>

  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="ring r1"></div>

  <div class="sun s1"><span>🌻</span></div>
  <div class="sun s2"><span>🌻</span></div>
  <div class="sun s3"><span>🌻</span></div>
  <div class="sun s4"><span>🌻</span></div>

  <div id="ask" class="content" style="width: 100%; max-width: 320px; position: relative; z-index: 5;">
    <div class="float-icon reveal" style="width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(146, 84, 130, 0.16); font-size: 42px;">☁️</div>
    <p class="serif reveal d1" style="font-size: 25px; font-weight: 500; margin: 0 0 10px; color: #4B1528; line-height: 1.3;">Une journée de repos ?</p>
    <p class="reveal d2" style="font-size: 15px; color: #993556; margin: 0 0 40px; line-height: 1.6;">Allez, on va te trouver un petit sourire pour finir la journée 🌻</p>
    <div class="reveal d3">
      <button id="non" style="padding: 15px 32px; font-size: 16px; font-weight: 500; background: #1D9E75; color: #ffffff; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(15, 110, 86, 0.3); transition: transform 0.12s ease, box-shadow 0.12s ease;">Oui volontiers 🌼</button>
    </div>
    <p id="taunt" style="font-size: 13.5px; font-style: italic; color: #7F77DD; margin: 26px 0 0; min-height: 20px;">&nbsp;</p>
  </div>

  <button id="oui" style="position: absolute; z-index: 6; left: 50%; top: 66%; transform: translate(70px,0); padding: 13px 22px; font-size: 15px; font-weight: 500; background: #D4537E; color: #ffffff; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(153, 53, 86, 0.3); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), left 0.35s cubic-bezier(0.34,1.56,0.64,1), top 0.35s cubic-bezier(0.34,1.56,0.64,1);">Hmm non</button>

  <div id="win" class="content" style="display: none; width: 100%; max-width: 320px; position: relative; z-index: 5;">
    <div class="float-icon" style="width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(29, 158, 117, 0.2); font-size: 42px; animation: pop 0.6s cubic-bezier(0.34,1.56,0.64,1);">😊</div>
    <p class="serif" style="font-size: 23px; font-weight: 500; margin: 0 0 16px; color: #04342C; animation: rise 0.6s ease both 0.15s;">Voilà 🌻</p>
    <p style="font-size: 15px; color: #0F6E56; margin: 0; line-height: 1.75; animation: rise 0.6s ease both 0.3s;">Si tu as cliqué jusqu'ici, c'est que tu es curieuse 😊<br><br>Alors envoie-moi un petit message, on trouvera de quoi te faire sourire.</p>
  </div>
</div>
<style>
.serif { font-family: Georgia, "Times New Roman", serif; }
@keyframes pop { 0%{transform:scale(0.3);opacity:0} 60%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
@keyframes rise { 0%{transform:translateY(14px);opacity:0} 100%{transform:translateY(0);opacity:1} }
@keyframes reveal { 0%{transform:translateY(18px);opacity:0} 100%{transform:translateY(0);opacity:1} }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
@keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(22px,-16px) scale(1.1)} }
@keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-18px,16px) scale(1.12)} }
@keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
@keyframes sway { 0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(9deg)} }
@keyframes grow { 0%{transform:scale(0) rotate(-40deg);opacity:0} 100%{transform:scale(1) rotate(0);opacity:1} }
.reveal { animation: reveal 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
.d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.22s; } .d3 { animation-delay: 0.34s; }
.float-icon { animation: floaty 4s ease-in-out infinite; }
.blob { position:absolute; border-radius:50%; filter:blur(34px); opacity:0.45; z-index:0; }
.b1 { width:180px; height:180px; background:#F4C0D1; top:-50px; left:-50px; animation:drift1 10s ease-in-out infinite; }
.b2 { width:200px; height:200px; background:#CECBF6; bottom:-60px; right:-60px; animation:drift2 12s ease-in-out infinite; }
.ring { position:absolute; border-radius:50%; z-index:0; opacity:0.2; }
.r1 { width:300px; height:300px; border:2px dashed #D4537E; top:50%; left:50%; margin:-150px 0 0 -150px; animation:spin 30s linear infinite; }
.sun { position:absolute; z-index:1; transform-origin:bottom center; }
.sun span { display:inline-block; animation:sway 4.5s ease-in-out infinite; }
.s1 { font-size:32px; bottom:12px; left:12px; animation:grow 0.7s cubic-bezier(0.34,1.56,0.64,1) both 0.2s; }
.s2 { font-size:26px; bottom:16px; right:14px; animation:grow 0.7s cubic-bezier(0.34,1.56,0.64,1) both 0.35s; }
.s2 span { animation-delay:-1.5s; }
.s3 { font-size:24px; top:14px; right:16px; animation:grow 0.7s cubic-bezier(0.34,1.56,0.64,1) both 0.5s; }
.s3 span { animation-delay:-3s; }
.s4 { font-size:20px; top:16px; left:14px; animation:grow 0.7s cubic-bezier(0.34,1.56,0.64,1) both 0.6s; }
.s4 span { animation-delay:-2s; }
@media (prefers-reduced-motion: reduce) { *{animation:none !important} }
</style>
<script>
(function(){
  var oui = document.getElementById('oui');
  var non = document.getElementById('non');
  var taunt = document.getElementById('taunt');
  var scene = document.getElementById('scene');
  var lines = ["Oups 🙈","Raté !","Par ici 👀","Hop hop hop","Trop rapide 🌸","Coucou 🌷"];
  var i = 0;
  function flee(){
    var pad = 14;
    var maxX = scene.clientWidth - oui.offsetWidth - pad;
    var maxY = scene.clientHeight - oui.offsetHeight - pad;
    var x = Math.round(pad + Math.random() * Math.max(0, maxX - pad));
    var y = Math.round(pad + Math.random() * Math.max(0, maxY - pad));
    oui.style.left = x + 'px';
    oui.style.top = y + 'px';
    oui.style.transform = 'scale(' + (Math.round((0.78 + Math.random()*0.14)*100)/100) + ') rotate(' + Math.round(Math.random()*24-12) + 'deg)';
    taunt.textContent = lines[i % lines.length];
    i++;
  }
  oui.addEventListener('mouseenter', flee);
  oui.addEventListener('touchstart', function(e){ e.preventDefault(); flee(); }, {passive:false});
  oui.addEventListener('click', function(e){ e.preventDefault(); flee(); });
  non.addEventListener('click', function(){
    document.getElementById('ask').style.display = 'none';
    oui.style.display = 'none';
    document.getElementById('win').style.display = 'block';
  });
})();
</script>
