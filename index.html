<div id="scene" style="min-height: 520px; background: linear-gradient(160deg, #FBEAF0 0%, #EEEDFE 55%, #E1F5EE 100%); border-radius: 20px; padding: 2rem 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; box-sizing: border-box;">
  <h2 class="sr-only">Petit message doux animé pour une journée de repos</h2>

  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="sun s1"><span>🌻</span></div>
  <div class="sun s2"><span>🌻</span></div>
  <div class="sun s3"><span>🌻</span></div>
  <div class="petal p1">✿</div>
  <div class="petal p2">❀</div>
  <div class="petal p3">✿</div>

  <div id="ask" style="width: 100%; position: relative; z-index: 5;">
    <div class="float-icon" style="width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(146, 84, 130, 0.16);">
      <i class="ti ti-cloud" style="font-size: 46px; color: #7F77DD;" aria-hidden="true"></i>
    </div>
    <p style="font-family: Georgia, 'Times New Roman', serif; font-size: 27px; font-weight: 500; margin: 0 0 8px; color: #4B1528;">Une journée de repos ?</p>
    <p style="font-size: 15px; color: #993556; margin: 0 0 34px; line-height: 1.6;">Allez, on va te trouver un petit sourire<br>pour finir la journée 🌻</p>

    <div id="box" style="position: relative; height: 130px; width: 100%; max-width: 280px; margin: 0 auto;">
      <button id="non" style="position: absolute; left: 50%; transform: translateX(-112%); top: 24px; padding: 15px 28px; font-size: 16px; font-weight: 500; background: #1D9E75; color: #ffffff; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(15, 110, 86, 0.3); transition: transform 0.12s ease, box-shadow 0.12s ease;">Oui volontiers 🌼</button>
      <button id="oui" style="position: absolute; left: 50%; transform: translateX(12%); top: 24px; padding: 15px 26px; font-size: 16px; font-weight: 500; background: #D4537E; color: #ffffff; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(153, 53, 86, 0.3); transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), left 0.18s ease, top 0.18s ease;">Hmm non</button>
    </div>
    <p id="taunt" style="font-size: 13.5px; font-style: italic; color: #7F77DD; margin: 22px 0 0; min-height: 20px; transition: opacity 0.2s;">&nbsp;</p>
  </div>

  <div id="win" style="display: none; width: 100%; position: relative; z-index: 5;">
    <div class="float-icon" style="width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(29, 158, 117, 0.2); animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1);">
      <i class="ti ti-mood-smile" style="font-size: 46px; color: #1D9E75;" aria-hidden="true"></i>
    </div>
    <p style="font-family: Georgia, 'Times New Roman', serif; font-size: 24px; font-weight: 500; margin: 0 0 14px; color: #04342C;">Voilà 🌻</p>
    <p style="font-size: 15px; color: #0F6E56; margin: 0; line-height: 1.7;">Si tu as cliqué jusqu'ici,<br>c'est que tu es curieuse 😊<br><br>Alors envoie-moi un petit message,<br>on trouvera de quoi te faire sourire.</p>
  </div>
</div>
<style>
@keyframes pop { 0%{transform:scale(0.4);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(20px,-16px) scale(1.08)} }
@keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-18px,14px) scale(1.1)} }
@keyframes drift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(14px,18px) scale(1.05)} }
@keyframes sway { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
@keyframes fall { 0%{transform:translateY(-20px) rotate(0);opacity:0} 10%{opacity:0.55} 100%{transform:translateY(540px) rotate(320deg);opacity:0} }
#non:hover { transform: translateX(-112%) scale(1.05); box-shadow: 0 6px 18px rgba(15,110,86,0.38); }
.float-icon { animation: floaty 4s ease-in-out infinite; }
.blob { position:absolute; border-radius:50%; filter:blur(30px); opacity:0.5; z-index:0; }
.b1 { width:180px; height:180px; background:#F4C0D1; top:-40px; left:-40px; animation:drift1 11s ease-in-out infinite; }
.b2 { width:200px; height:200px; background:#CECBF6; bottom:-50px; right:-50px; animation:drift2 13s ease-in-out infinite; }
.b3 { width:150px; height:150px; background:#9FE1CB; bottom:40px; left:-30px; animation:drift3 15s ease-in-out infinite; }
.sun { position:absolute; z-index:1; transform-origin:bottom center; }
.sun span { display:inline-block; animation:sway 5s ease-in-out infinite; }
.s1 { font-size:34px; bottom:14px; left:18px; }
.s2 { font-size:26px; bottom:20px; right:22px; animation-delay:-2s; }
.s2 span { animation-delay:-1.5s; }
.s3 { font-size:22px; top:20px; right:26px; }
.s3 span { animation-delay:-3s; }
.petal { position:absolute; z-index:1; color:#D4537E; opacity:0.55; animation:fall linear infinite; }
.p1 { font-size:16px; left:20%; animation-duration:9s; }
.p2 { font-size:20px; left:55%; animation-duration:12s; animation-delay:-4s; color:#7F77DD; }
.p3 { font-size:14px; left:80%; animation-duration:10s; animation-delay:-7s; color:#EF9F27; }
@media (prefers-reduced-motion: reduce) { .blob,.sun span,.petal,.float-icon{animation:none} }
</style>
<script>
(function(){
  var oui = document.getElementById('oui');
  var non = document.getElementById('non');
  var taunt = document.getElementById('taunt');
  var box = document.getElementById('box');
  var lines = ["Oups 🙈","Raté !","Par ici 👀","Hop hop hop","Trop rapide 🌸","Coucou 🌷"];
  var i = 0;
  function flee(){
    var maxX = box.clientWidth - oui.offsetWidth;
    var maxY = box.clientHeight - oui.offsetHeight;
    var x = Math.round(Math.random() * Math.max(0, maxX));
    var y = Math.round(Math.random() * Math.max(0, maxY));
    oui.style.left = x + 'px';
    oui.style.top = y + 'px';
    oui.style.transform = 'scale(' + (Math.round((0.74 + Math.random()*0.14)*100)/100) + ') rotate(' + Math.round(Math.random()*20-10) + 'deg)';
    taunt.textContent = lines[i % lines.length];
    i++;
  }
  oui.addEventListener('mouseenter', flee);
  oui.addEventListener('touchstart', function(e){ e.preventDefault(); flee(); }, {passive:false});
  oui.addEventListener('click', function(e){ e.preventDefault(); flee(); });
  non.addEventListener('click', function(){
    document.getElementById('ask').style.display = 'none';
    document.getElementById('win').style.display = 'block';
  });
})();
</script>
